schemaVersion: "1"
kind: sandbox
name: pi
displayName: Pi
description: Pi coding agent with OpenRouter free-tier + GitHub Copilot support

sandbox:
  image: nmiquan/sbx-pi-template:latest

network:
  allowedDomains:
    - "registry.npmjs.org:443"
    - "opencode.ai:443"
    - "openrouter.ai:443"
    - "api.openrouter.ai:443"
    - "api.github.com:443"
    - "github.com:443"
    - "github.com:80"
    - "copilot-proxy.githubusercontent.com:443"
    - "pi.dev:443"
    - "context7.com:443"
  serviceDomains:
    context7.com: context7
  serviceAuth:
    context7:
      headerName: Authorization
      valueFormat: "Bearer %s"

credentials:
  sources:
    context7:
      env:
        - CONTEXT7_API_KEY

environment:
  proxyManaged:
    - CONTEXT7_API_KEY

memory: |
  ## Sandbox environment
  You are running inside a Docker sandbox (microVM).
  The workspace is mounted at its absolute host path.
  Available providers: OpenRouter (free tier) and GitHub Copilot.
