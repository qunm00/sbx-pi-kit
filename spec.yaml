schemaVersion: "1"
kind: agent
name: pi
displayName: Pi
description: Pi coding agent with OpenRouter free-tier + GitHub Copilot support

agent:
  image: nmiquan/sbx-pi-template:2026-07-11
  entrypoint:
    run: [pi]

network:
  allowedDomains:
    - "registry.npmjs.org:443"
    - "openrouter.ai:443"
    - "api.github.com:443"
    - "github.com:443"
    - "copilot-proxy.githubusercontent.com:443"

commands:
  install:
    - command: >
        pi install npm:pi-mcp-adapter
      user: "1000"
      description: "Install Pi extensions"

credentials:
  sources:
    github:
      env: [GITHUB_TOKEN]
  environment:
    proxyManaged: [GITHUB_TOKEN, OPENROUTER_API_KEY]

memory: |
  ## Sandbox environment
  You are running inside a Docker sandbox (microVM).
  The workspace is mounted at its absolute host path.
  Available providers: OpenRouter (free tier) and GitHub Copilot.